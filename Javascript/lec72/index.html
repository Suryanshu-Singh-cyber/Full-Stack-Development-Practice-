<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
       /* Reset and global layout */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', system-ui, sans-serif;
}

body {
    background: linear-gradient(135deg, #7798eb, #090820);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    color: #f8fafc;
}

/* Modern Card Container */
.container {
    background: rgba(4, 176, 139, 0.03);
    backdrop-filter: blur(12px);
    border: 1px solid rgb(228, 7, 7);
    padding: 2.5rem;
    border-radius: 24px;
    box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 1.5rem;
    max-width: 900px;
    width: 90%;
}

/* The Individual Boxes */
.box {
    height: 140px;
    border-radius: 16px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    font-weight: 700;
    font-size: 1.1rem;
    letter-spacing: 0.5px;
    box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
    cursor: pointer;
    
    /* Smooth 0.5 second fade transition when colors change */
    transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
}

/* Subtle hover effect to make it interactive */
.box:hover {
    transform: translateY(-5px) scale(1.03);
    box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.4);
}

/* Small label for the RGB text inside the box */
.box span {
    font-size: 0.75rem;
    font-weight: 400;
    margin-top: 8px;
    opacity: 0.8;
}

    </style>
</head>
<body>
    <!-- 
        Given 5 boxes, Assign a random color and a random background to each box using DOM concepts
     -->
     <div class="container">
        <div class="box">Box</div>
        <div class="box">Box</div>
        <div class="box">Box</div>
        <div class="box">Box</div>
        <div class="box">Box</div>
     </div>
     <script src="script.js"></script>
</body>
</html>
