<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300&display=swap');
    </style>


    <style>
        :root{

            --primary-color: #f052e3cc;
            --text-color: white;
            --secondary-color:#dfa0dfcc;
        }

        body{
            background-color: var(--secondary-color);
        }
        *{
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;


        }
           nav {
            background-color: var(--primary-color);
            padding: 12px 0;
        }
         ul li{
            list-style: none;
            display: inline;
            padding: 23px;
            font-weight: bolder;
            
        }
          ul li a{
            color: var(--text-color);
            text-decoration: none;
        }


        .mainbox{
            background-color:greenyellow;
            border:2px solid green;
            padding: 200px 2px ;
            margin: auto;



        }
        .box1{
            background-color:rgb(230, 12, 241);
            border:2px solid rgb(236, 12, 213);
            padding: 150px 80px ;
            margin: 10px;
            height: 80px;
            width: 330vw;
            


        }
        .box2{
            background-color:rgb(12, 241, 230);
            border:2px solid rgb(4, 40, 59);
            padding: 150px 80px ;
            margin: 10px;
            height: 80px;
            width: 330px;
            left: 2px;







        }
        .Outbox{
            background-color: black;
            height: 150vh;
            color: aliceblue;
            text-align: center;

        }

        .orangebox{
             height: 32px;
            width: 32px;
            background: orange;
            position: fixed;
            bottom: 12px;
            right: 23px;
            border-radius: 60px;
            text-decoration-color: aqua;
            text-align: center;
            






        }
    </style>







</head>
<body>
    <header>
       <nav>
        <ul>

            <li><a href="/">Home </a></li>
            <li><a href="/">About</a></li>
                <li><a href="/">Services</a></li>
                <li><a href="/">Contact Us</a></li>

        </ul>
       </nav>

    </header>

    <div class="mainbox">

      <span class="box1">BOX1</span>
      <span class="box2">BOX2</span>




    </div>
    
    <div class="Outbox">
        <p>This is what i want to learn </p>

    </div>

    <div class="orangebox">
        O
    </div>


    
</body>
</html>
