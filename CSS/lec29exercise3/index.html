<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>  
    *{
        margin: 0;
        padding: 0;
        box-sizing: border-box; /* Ensures padding doesn't break widths */
    }
    
    body{
        background-color: gray;
        padding: 45px;
        display: flex;
    }

    .card{
        background-color: #fff;
        width: 198px;
        border-radius: 7px;
        padding: 0 0 34px 0;
        margin: 4px;
    }

    /* Fixed: Targets the image directly inside the card and centers it */
    .card img {
        display: block;
        margin: 8px auto; /* 8px top/bottom spacing, auto left/right centers it */
        max-width: 92%;   /* Keeps image slightly smaller than the 198px card */
        height: auto;
        border-radius: 7px;
    }

    .content{
        padding: 7px 13px;
        font-family: 'Poppins', sans-serif;
    }

    /* Added heading styling to match the card text size scale */
    .content h1 {
        font-size: 14px;
        margin-bottom: 4px;
    }

    .content p{
        font-size: 9px;
        color: gray;
        line-height: 1.3;
    }

    .capsules{
        padding: 0 14px; /* Balanced left/right spacing */
        margin-bottom: 8px;
    }

    .capsules span{
        border: 1px solid gray;
        padding: 2px 6px;
        border-radius: 7px;
        font-size: 8px;
        font-family: 'Baloo Bhai 2', sans-serif; 
        display: inline-block;
        margin-right: 4px;
    }

    .button{
        text-align: center;
    }

    .button button{
        padding: 7px 15px;
        border-radius: 15px;
        background-color: rgb(216, 236, 253);
        color: rgb(14, 150, 234);
        font-size: 10px;
        margin-top: 7px;
        border: none;
        font-weight: bold;
        cursor: pointer;
    }

    .button button:hover{
        background-color: rgb(194, 225, 246);
        color: rgb(10, 136, 214);
    }

    .card h1{
        background-color: #fdf3e0;
        color: #f9aa0e;
    }
    </style>
</head>
<body>

    <div class="card"> 
        <!-- Image now automatically scales and centers -->
        <img src="Screen.png" alt="Shyaar">
          
        <div class="capsules">
            <span class="o">Nature love</span>
            <span class="o1">Lake IIT Bombay</span>
        </div>

        <!-- Fixed lowercase 'c' to match the CSS class structure -->
        <div class="content">
            <h1>Dekh tu IIT Bombay mai just feel it </h1>
            <p>Tera mera sb ka hai tu ab kaha khoya hu mai kisi ko na pata hai manta hu waqt ti thori shikwa hai per waqt badlnai ka jasba hai </p>
        </div>
              
        <div class="button"> 
            <button> Read More </button>
        </div>
    </div> <!-- Fixed: Added missing card closing tag -->

</body>
</html>
