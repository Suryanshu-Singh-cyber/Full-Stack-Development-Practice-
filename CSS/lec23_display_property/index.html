<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Display Property</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        .box {
            border: 2px solid blue;
            display: inline-block;
            width: 344px;
            padding:45px;
            margin: 34px;
            font-display: fallback; 
        }

        .box1{
            /* display: none;
            visibility: hidden; */

        }
        .g12{

             border: 2px solid rgb(204, 184, 10);
            display: inline-block;
            width: 344px;
            padding:45px;
            margin: 34px;
            /* display: ruby-base; */

        }
    </style>
</head>

<body>
    <!-- https://developer.mozilla.org/en-US/docs/Web/CSS/display -->
    <div class="box box1">
        I am a box
    </div>
    <div class="box">also a nice box</div>

    <span class="g12">  <br> <br>I am a good</span>
    <span class="green">boy</span>
</body>

</html>
