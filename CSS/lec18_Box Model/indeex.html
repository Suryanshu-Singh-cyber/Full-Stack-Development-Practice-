<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box model</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }

        .box {
            background-color: aqua;
        }

        .box1 {
            color: blueviolet;
            padding: 10px;
            margin: 9px;
            border: 2px solid blue;
            height: 200px;
            box-sizing: border-box;
        }

        .box2 {
            color: red;
            padding: 10px;
            margin: 25px;
            border: 5.5px solid rgb(252, 18, 18);
            height: 200px;
            box-sizing: border-box;
        }
    </style>


</head>


<body>
    <div class="box box1"> elloooooo I am a box </div>
    <div class="box box2">Elloooo I am another boxooo</div>
</body>

</html>
