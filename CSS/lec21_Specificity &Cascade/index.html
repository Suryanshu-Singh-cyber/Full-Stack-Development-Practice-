<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        h1{ /* The specificity of this selector is 1  */
            color: aqua;
        }
        .cpurple{/* The specificity of this selector is 10  */
            color: purple;

        }
        h1.yellow{  /* The specificity of this selector is 1 + 10 = 11  */
            color:yellow;

        }
        .yellow cred cpurple{
            color: black;
        }
 /* This is an example of attribute selector. The specificity of this selector is 10 */
        [data-x=a]{
            
            color: brown;
        }
        .cred{ /* The specificity of this selector is 10  */
            color:red;

        }
         /* The specificity of this selector is 1 + 10 + 10 + 10 + 10 = 41  */
        a.harryclass.rohan-class[href]:hover {
            color: blueviolet;
        }



    </style>






       
</head>
<body>
    <div>
        <h1 class="yellow cred cpurple" data-x="a">CSS SPECIFICITY</h1>




    </div>
    
</body>
</html>
